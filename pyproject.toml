[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "fastapi[standard]>=0.141.1",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
